[project]
name = "cablecell"
version = "0.1.0"
description = "Benchtop cable-making robot cell — ribbon in, finished Molex 5264 cables out"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.10",
    "numpy>=2.0",
    "pillow>=12.3.0",
]

# Not a distributable package: the repo is run in place
# (`uv run python -m sim.<entry>` from the repo root), so nothing is installed
# into site-packages and the generic top-level package name `sim` cannot
# collide with anything.
[tool.uv]
package = false
